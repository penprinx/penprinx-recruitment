<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PENPRINX Next-Stage Recruitment Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h2>PENPRINX Recruitment Portal</h2>
        <p class="subtitle">Please fill out your details to proceed to the next stage.</p>

        <form id="recruitmentForm" action="#" method="POST" enctype="multipart/form-data">
            
            <!-- Personal Information -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="phone">Contact Number (WhatsApp)</label>
                <input type="tel" id="phone" name="phone" required placeholder="e.g. +233...">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label for="location">Residential Location / City</label>
                <input type="text" id="location" name="location" required placeholder="e.g. Accra">
            </div>

            <!-- Availability & Commitment -->
            <div class="form-group">
                <label for="availability">Are you available for upcoming training and orientation sessions?</label>
                <select id="availability" name="availability" required>
                    <option value="">Select an option</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div class="form-group">
                <label for="schedule">Weekly availability for deployment:</label>
                <select id="schedule" name="schedule" required>
                    <option value="">Select preference</option>
                    <option value="Weekdays">Weekdays</option>
                    <option value="Weekends">Weekends</option>
                    <option value="Full-time">Full-time</option>
                </select>
            </div>

            <!-- Experience & Skills -->
            <div class="form-group">
                <label for="experience">Brief summary of background in customer service/hospitality:</label>
                <textarea id="experience" name="experience" rows="4" placeholder="Tell us about your background..."></textarea>
            </div>

            <div class="form-group">
                <label for="languages">Languages spoken fluently</label>
                <input type="text" id="languages" name="languages" placeholder="e.g. English, Twi">
            </div>

            <!-- Verification Uploads -->
            <div class="form-group">
                <label for="photo">Passport-sized Photograph</label>
                <input type="file" id="photo" name="photo" accept="image/*" required>
            </div>

            <div class="form-group">
                <label for="idCard">Valid ID Card</label>
                <input type="file" id="idCard" name="idCard" accept=".pdf,image/*" required>
            </div>

            <button type="submit" class="submit-btn">Submit Application</button>
        </form>
    </div>

</body>
</html>
